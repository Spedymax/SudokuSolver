sonar.projectKey=sudoku-solver
sonar.projectName=Sudoku Solver
sonar.projectVersion=1.0

sonar.sources=.
sonar.tests=.
sonar.python.version=3.8

# Конфигурация для отчетов о покрытии кода
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.coverage.jacoco.xmlReportPaths=coverage.xml

# Исключения
sonar.exclusions=**/__pycache__/**,**/*.pyc
sonar.test.inclusions=**/test_*.py

# Дополнительные настройки
sonar.sourceEncoding=UTF-8
sonar.python.coverage.overallReportPath=coverage.xml